# Local verification of the Docker bonus (docs/DESIGN.md §18) before/without a
# real K8s cluster. "backend" is deliberately the service name — nginx.conf
# hardcodes it, and it should stay the same as the K8s Service name in Phase 7
# so the same frontend image works unchanged in both environments.
services:
  redis:
    image: redis:7-alpine
    # No auth (`--requirepass`) configured. Acceptable ONLY because this
    # instance has zero external exposure in this topology (`expose`, not
    # `ports` — never reachable from the host). If that ever changes (e.g. a
    # port gets published for local debugging), add auth + a secret first.
    expose:
      - "6379" # internal only — the SignalR backplane, not a public service

  backend:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Redis__ConnectionString: "redis:6379" # ADR 0001 — enables the SignalR backplane
    expose:
      - "8080" # internal only — never published to the host, matching §18/§19
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "5180:8080" # host-side port is arbitrary; container stays 8080 either way
    depends_on:
      - backend
