# See docs/DESIGN.md §18 for why this is a reverse proxy (not CORS-everywhere):
# the browser only ever talks to this origin; the backend stays internal-only
# (compose service name / K8s ClusterIP "backend", not directly reachable).

# Standard nginx WebSocket-proxy pattern: only send `Connection: upgrade` when
# the client actually asked to upgrade — the documented, easy-to-miss gotcha
# from §18/§25 (a hardcoded "upgrade" would be incorrect for plain requests,
# e.g. SignalR's /negotiate call).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback for React Router — without this, refreshing /monitor
    # directly returns 404 (docs/DESIGN.md §25 risk).
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s; # keep the long-lived WebSocket connection open
    }
}
