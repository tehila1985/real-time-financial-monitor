version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # Keeps the actions pinned in ci.yml (checkout, setup-dotnet, setup-node) up
  # to date too — a CI pipeline is itself a dependency surface, not just the
  # app's own packages.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
